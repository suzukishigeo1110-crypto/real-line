function store(){try{localStorage.setItem("real-line-v01",JSON.stringify(saved))}catch{}}function init(){board=Array.from({length:36},()=>Math.floor(Math.random()*5));for(let i=0;i<36;i++){let t=0;while(matches().has(i)&&t++<12)board[i]=Math.floor(Math.random()*5)};if(!possibleMove())return init();selected=-1;hp=150;moves=12;combo=0;validMoves=0;locked=false;won=false;quizDone=false;quizIndex=0;quizCorrect=0;quizOrder=[0,1,2].sort(()=>Math.random()-0.5);closeModal();render()}
function matches(){const hit=new Set();for(let r=0;r<6;r++)for(let c=0;c<6;){let n=1;while(c+n<6&&board[r*6+c]===board[r*6+c+n])n++;if(board[r*6+c]!==null&&n>=3)for(let j=0;j<n;j++)hit.add(r*6+c+j);c+=n}for(let c=0;c<6;c++)for(let r=0;r<6;){let n=1;while(r+n<6&&board[r*6+c]===board[(r+n)*6+c])n++;if(board[r*6+c]!==null&&n>=3)for(let j=0;j<n;j++)hit.add((r+j)*6+c);r+=n}return hit}
function adjacent(a,b){return Math.abs(Math.floor(a/6)-Math.floor(b/6))+Math.abs(a%6-b%6)===1}function swap(a,b){[board[a],board[b]]=[board[b],board[a]]}function possibleMove(){for(let a=0;a<36;a++)for(const b of [a+1,a+6])if(b<36&&adjacent(a,b)){swap(a,b);let yes=matches().size>0;swap(a,b);if(yes)return true}return false}
function refill(){for(let c=0;c<6;c++){let vals=[];for(let r=5;r>=0;r--)if(board[r*6+c]!==null)vals.push(board[r*6+c]);for(let r=5;r>=0;r--)board[r*6+c]=r>5-vals.length?vals[5-r]:Math.floor(Math.random()*5)}}
function resolve(){let chain=0,total=0;while(chain<30){const hit=matches();if(!hit.size)break;chain++;total+=hit.size;hit.forEach(i=>board[i]=null);refill()}combo=chain;const damage=total*2+Math.max(0,chain-1)*8;hp=Math.max(0,hp-damage);return damage}
function move(a,b){swap(a,b);if(!matches().size){swap(a,b);$("notice").textContent="揃わなかった！ 3つ以上揃う交換を探そう。";selected=-1;render();return}moves--;validMoves++;const damage=resolve();$("notice").textContent="⚔️ "+combo+" COMBO！ "+damage+"ダメージ！";selected=-1;if(hp===0){if(quizIndex<3){quiz();return}win();return}if(moves<=0){if(field==="business"&&quizIndex<3){quiz();return}lose();return}if(!possibleMove()){board=Array.from({length:36},()=>Math.floor(Math.random()*5));for(let i=0;i<36;i++)while(matches().has(i))board[i]=Math.floor(Math.random()*5);$("notice").textContent+=" 盤面をシャッフル！"}render();if(validMoves%3===0&&(field!=="business"||quizIndex<3))quiz()}
function render(){$("stage").textContent=data[field].icon+" "+data[field].name+" Lv."+(level+1)+"「"+stage[0]+"」";const ranks=["地下闘技場の門番","鉄壁の挑戦者","百戦錬磨の猛者","伝説級の覇者","最強の求道者"];const lines=["その一手、見せてみろ。","まだ本気を出していない。","覚悟だけでは、勝てない。","ここからが本当の勝負だ。","知識と行動、その全てを示せ。"];$("bossPanel").dataset.tier=String(level+1);$("bossRank").textContent="BOSS RANK "+(level+1)+" / 5";$("bossName").textContent=ranks[level];$("bossFlavor").textContent=lines[level];$("hpBar").style.width=(hp/150*100)+"%";$("hpText").textContent="BOSS HP "+hp+"/150";$("moves").textContent="残り "+moves+"手";$("combo").textContent="COMBO "+combo;$("exp").textContent="EXP "+(Object.values(saved.clear||{}).filter(Boolean).length*100+Object.values(saved.real||{}).filter(Boolean).length*50);$("mission").textContent=stage[5];$("real").checked=!!(saved.real||{})[key];$("board").replaceChildren(...board.map((gem,i)=>{const b=document.createElement("button");b.className="gem gem-"+gem+(selected===i?" sel":"");b.textContent=icons[gem];b.setAttribute("aria-label",(Math.floor(i/6)+1)+"行"+(i%6+1)+"列 "+icons[gem]);b.disabled=locked;b.onclick=()=>{if(locked)return;if(selected===-1){selected=i;render();return}if(selected===i){selected=-1;render();return}if(!adjacent(selected,i)){selected=i;render();return}move(selected,i)};return b}))}
function showModal(body){locked=true;$("modalBody").replaceChildren();$("modalActions").replaceChildren();$("modalBody").append(body);$("modal").classList.remove("hidden");render()}function closeModal(){$("modal").classList.add("hidden");locked=false}
function button(text,fn){const b=document.createElement("button");b.className="action";b.style.width="100%";b.style.marginTop="10px";b.textContent=text;b.onclick=fn;return b}
function quiz(){const q=(field==="business"?businessBank:extraBanks[field])[level][quizOrder[Math.min(quizIndex,2)]];const wrap=document.createElement("div");const h=document.createElement("h2");h.textContent="🧠 "+data[field].name+"の試練 "+(quizIndex+1)+" / 3";wrap.append(h);const p=document.createElement("p");p.textContent=q[0];wrap.append(p);const result=document.createElement("p");result.className="gold";wrap.append(result);const opts=q[1].map((o,i)=>{const b=document.createElement("button");b.className="choice";b.textContent="ABC"[i]+"　"+o;b.onclick=()=>{opts.forEach(x=>x.disabled=true);b.classList.add(i===q[2]?"correct":"wrong");result.textContent=(i===q[2]?"正解！ ボスに30ダメージ！ ":"惜しい！ ")+q[3];if(i===q[2]){RealLineAudio.effect("correct");hp=Math.max(0,hp-30);quizDone=true;quizCorrect++}if(i!==q[2])RealLineAudio.effect("wrong");quizIndex++;const done=()=>{closeModal();if(field==="business"&&quizIndex<3&&(hp===0||moves<=0)){quiz();return}if(hp===0){if(quizCorrect<2){lose("ボスは倒したけど、学習問題の正解が"+quizCorrect+"/3問。2問以上正解でクリア！");return}win();return}if(moves<=0){lose();return}render()};$("modalActions").append(button("解説を読んで続ける →",done))};return b});opts.forEach(b=>wrap.append(b));showModal(wrap)}

function win(){RealLineAudio.effect("win");won=true;locked=true;saved.clear=saved.clear||{};saved.clear[key]=true;store();render();const w=document.createElement("div");const h=document.createElement("h2");h.textContent="🏆 ボス撃破！";w.append(h);const p=document.createElement("p");p.textContent="「"+stage[0]+"」を攻略！ ＋100 EXP。次は現実のクエストにも挑戦しよう！";w.append(p);showModal(w);$("modalActions").append(button("⭐ このジャンルのレベルを選ぶ",()=>location.href="./stages.html?field="+encodeURIComponent(field)));$("modalActions").append(button("🗺️ 別のジャンルを選ぶ",()=>location.href="./genres.html"));$("modalActions").append(button("もう一度挑戦",init))}
function lose(reason){const w=document.createElement("div");const h=document.createElement("h2");h.textContent="💫 あと一歩！";w.append(h);const p=document.createElement("p");p.textContent=reason||("残りのボスHPは"+hp+"。パズルの組み合わせを変えて再挑戦！");w.append(p);showModal(w);$("modalActions").append(button("再挑戦する",init))}
$("real").onchange=e=>{saved.real=saved.real||{};saved.real[key]=e.target.checked;store();render()};$("reset").onclick=init;$("hint").onclick=()=>{const w=document.createElement("div");const h=document.createElement("h2");h.textContent="🎮 遊び方";w.append(h);const p=document.createElement("p");p.textContent="① ピースを1つタップ。② 隣のピースをタップして交換。③ 同じ絵柄が縦か横に3つ以上揃うと攻撃！ ④ 3手ごとに学習クイズが登場。正解すると追加ダメージ。12手以内にボスのHPを0にしよう！ 揃わない交換は手数を消費しないよ。";w.append(p);showModal(w);$("modalActions").append(button("バトルに戻る",()=>{closeModal();render()}))};init();RealLineAudio.mount("battle");
</script></body></html>
