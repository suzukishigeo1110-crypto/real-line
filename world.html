<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142c37"><title>REAL LINE WORLD</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#fff5dd;background:#101f2d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#335f60,#101f2d 75%)}main{max-width:800px;margin:auto;padding:18px 14px 70px}a{color:#f8d591}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px}h1{font-size:clamp(30px,7vw,50px);margin:22px 0 5px;color:#ffe5a2}p{color:#b9d4d2;line-height:1.6}.panel{border:1px solid #71938a;background:#162d3ac9;border-radius:18px;padding:16px;margin:16px 0}.garden{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;aspect-ratio:1.2;background:linear-gradient(145deg,#81ad77,#4e865d);padding:8px;border:6px solid #aa9a6c;border-radius:20px;box-shadow:0 18px 40px #0008;transform:perspective(850px) rotateX(12deg);transform-origin:top}.tile{border:1px solid #a8d1984a;border-radius:7px;background:#ffffff0c;display:grid;place-items:center;font-size:clamp(19px,5vw,36px);cursor:pointer;min-width:0;box-shadow:inset 0 2px #ffffff15}.tile:focus-visible{outline:3px solid #ffe9a8}.tile.selected{outline:3px solid #fff1a2;background:#fff3aa4a}.inventory{display:flex;gap:8px;flex-wrap:wrap}.item,button{font:inherit;border:1px solid #9bb7aa;background:#25485a;color:#fff3d6;border-radius:11px;padding:10px;cursor:pointer}.item[aria-pressed=true]{background:#8c713e;border-color:#ffde92}.item:disabled{opacity:.45}.small{font-size:12px;color:#bed5d0}.memory{line-height:1.7;white-space:pre-wrap}.count{font-weight:800;color:#ffe1a0}dialog{background:#1c3440;border:1px solid #b4bd9b;color:#fff6df;border-radius:16px;width:min(92vw,440px);padding:22px}dialog::backdrop{background:#050d16bc}@media(prefers-reduced-motion:reduce){.garden{transform:none}}@import url('https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&display=swap');body{background:radial-gradient(ellipse at 50% -10%,#3d7772,#142c36 45%,#0b1823)}h1{font-family:Georgia,'Zen Old Mincho',serif;letter-spacing:.035em;text-shadow:0 4px 20px #0008}main{max-width:880px}.panel{border-color:#b7a06c88;box-shadow:inset 0 1px #ffe3a61a,0 15px 30px #0003;background:linear-gradient(135deg,#203b42ed,#142734f5)}.world-scene{height:clamp(220px,47vw,370px);border-radius:23px;position:relative;overflow:hidden;margin:20px 0 8px;border:4px solid #ae9462;box-shadow:0 16px 42px #0009,inset 0 0 0 2px #ffe9b58c;background:linear-gradient(#91c6cf 0%,#d3dbbb 47%,#7ca67b 48%,#3f7554 100%)}.sky-glow{position:absolute;inset:0;background:radial-gradient(circle at 74% 20%,#fff6cfbb,transparent 28%)}.sun{position:absolute;right:19%;top:10%;height:53px;width:53px;border-radius:50%;background:#fff3c5;box-shadow:0 0 50px #ffe9ac}.far-mountain{position:absolute;bottom:44%;width:65%;height:54%;background:#709c9c;clip-path:polygon(0 100%,38% 18%,55% 50%,75% 0,100% 100%)}.m1{left:-15%;opacity:.6}.m2{right:-16%;background:#729ca0;opacity:.75}.m3{left:20%;bottom:42%;background:#527f80;opacity:.75;transform:scale(.75)}.scene-tree{position:absolute;font-size:clamp(68px,16vw,140px);bottom:21%;filter:drop-shadow(4px 12px 4px #1c442e88);z-index:3}.left-tree{left:0}.right-tree{right:2%}.scene-house{position:absolute;width:clamp(130px,31vw,225px);height:58%;left:50%;bottom:19%;transform:translateX(-50%);z-index:2;filter:drop-shadow(6px 10px 3px #24462d99)}.roof{position:absolute;top:3%;left:-10%;width:120%;height:49%;background:linear-gradient(140deg,#8c5962,#523c57 72%);clip-path:polygon(50% 0,100% 83%,92% 100%,8% 100%,0 83%);border-radius:9px}.house-wall{position:absolute;bottom:0;left:9%;height:57%;width:82%;background:linear-gradient(110deg,#f0d1a0,#b78462);border:5px solid #745243;display:flex;justify-content:space-around;align-items:center;border-radius:3px 3px 10px 10px}.window{width:24%;height:33%;background:#f9c46c;color:#fff1be;display:grid;place-items:center;border:5px solid #6a493c;box-shadow:0 0 17px #ffd16d}.door{align-self:end;height:69%;width:29%;border:5px solid #684b39;border-radius:13px 13px 0 0;background:#805b46}.scene-path{position:absolute;bottom:-25%;left:37%;width:26%;height:48%;background:repeating-linear-gradient(155deg,#cbb68b 0 19px,#a99574 20px 23px);clip-path:polygon(33% 0,67% 0,100% 100%,0 100%);z-index:2}.scene-flower{position:absolute;z-index:4;font-size:clamp(20px,5vw,38px);bottom:13%}.f1{left:22%}.f2{right:25%;bottom:8%}.f3{left:12%;bottom:8%}.scene-caption{position:absolute;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(transparent,#0b211ec7);color:#ffe7ad;text-align:center;letter-spacing:.14em;font-size:clamp(8px,1.7vw,11px);z-index:5}.scene-caption span{margin:0 8px}.garden-panel{border-color:#e2c681}.garden{background:linear-gradient(145deg,#a7c68a,#548f63);border:9px solid #b99c6d;box-shadow:0 20px 25px #0007,inset 0 0 30px #254f3b99}.tile{background:radial-gradient(circle at 30% 20%,#d4e7a33a,#3f7b533b);border:1px solid #c3e4b15c;text-shadow:0 3px 4px #193a28;transition:transform .15s,background .15s}.tile:hover,.tile:focus-visible{transform:translateY(-3px);background:#f8dc9a40}.item{background:linear-gradient(140deg,#466756,#25485a);box-shadow:inset 0 1px #fff4}.item[aria-pressed=true]{box-shadow:0 0 0 2px #ffe9a2,0 0 18px #ffe6a866}@media(max-width:500px){.scene-tree{font-size:72px}.world-scene{height:230px}.garden{transform:perspective(850px) rotateX(7deg)}}@media(prefers-reduced-motion:reduce){.tile{transition:none}}html,body{height:100%;overflow:hidden}main{height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));max-width:680px}main>h1{font-size:clamp(22px,5vw,32px);margin:5px 0 1px}main>p{display:none}.world-scene{flex:none;height:clamp(60px,15dvh,140px);margin:5px 0;min-height:0}.scene-house{width:120px}.scene-tree{font-size:58px;bottom:8%}.scene-caption{font-size:9px}.garden-panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;margin:5px 0;padding:8px}.garden-panel>p{display:none}.garden{flex:1;min-height:0;min-width:0;aspect-ratio:auto;width:min(100%,calc((100dvh - 310px)*1.2));max-width:100%;align-self:center;margin:0;transform:none;border-width:5px;padding:4px;gap:3px}.tile{font-size:clamp(18px,5vw,30px);border-radius:5px}.garden-panel b{font-size:13px}.panel{margin:5px 0;padding:9px}.panel:has(#inventory){flex:none}.panel:has(#inventory) h2{font-size:15px;margin:0 0 5px}.inventory{gap:5px;max-height:84px;overflow:auto}.item{padding:6px 9px;font-size:12px}.panel:has(#inventory) #message{font-size:11px;margin:4px 0 0}.panel:has(#status){display:none}dialog{max-height:85dvh;overflow:auto}@media(max-height:750px){.world-scene{height:70px}.scene-house{height:100%;bottom:0}.scene-tree{font-size:45px}.garden{width:min(100%,calc((100dvh - 260px)*1.2))}}@media(max-height:610px){.world-scene{display:none}.garden{width:min(100%,calc((100dvh - 180px)*1.2))}.panel:has(#inventory) #message{display:none}}</style></head><body><main><div class="top"><a href="./hub.html">← 冒険メニュー</a><a href="./index.html">タイトルへ</a></div><h1>🌳 REAL LINE WORLD</h1><p>現実の達成が、庭の景色に変わる。思い出の宿る庭を育てよう。</p><div class="world-scene" aria-hidden="true"><div class="sky-glow"></div><div class="far-mountain m1"></div><div class="far-mountain m2"></div><div class="far-mountain m3"></div><div class="sun"></div><div class="scene-tree left-tree">🌳</div><div class="scene-tree right-tree">🌸</div><div class="scene-house"><div class="roof"></div><div class="house-wall"><span class="window">✦</span><span class="door"></span><span class="window">✦</span></div></div><div class="scene-path"></div><div class="scene-flower f1">🌷</div><div class="scene-flower f2">🌼</div><div class="scene-flower f3">🌻</div><div class="scene-caption">YOUR LITTLE WORLD <span>✦</span> A LIFE BUILT ONE STEP AT A TIME</div></div><section class="panel garden-panel"><b>🏡 はじまりの庭</b><p class="small">素材を選んで空きマスをタップすると配置。置いたものをタップすると、達成したミッションが見られるよ。</p><div class="garden" id="garden" aria-label="庭の配置盤面"></div></section><section class="panel"><h2>🎒 素材バッグ</h2><div class="inventory" id="inventory"></div><p class="small" id="message" aria-live="polite"></p></section><section class="panel"><h2>🏆 この庭に宿る記録</h2><p class="small" id="status"></p><p class="small">最初の試作は斜め上から眺める2.5Dの庭。3Dのカメラ移動や家の内装は、これから追加するよ。</p></section></main><dialog id="detail"><h2 id="detailTitle"></h2><div class="memory" id="detailText"></div><p><button id="remove">配置を戻す</button> <button id="close">閉じる</button></p></dialog><script src="./audio.js?v=20261005-audiofix3"></script><script>"use strict";const MKEY="real-line-missions-v1",WKEY="real-line-world-v1";let missions=[],world={cells:Array(36).fill(null)};try{const v=JSON.parse(localStorage.getItem(MKEY)||"[]");if(Array.isArray(v))missions=v}catch{}try{const v=JSON.parse(localStorage.getItem(WKEY)||"{}");if(Array.isArray(v.cells)&&v.cells.length===36)world=v}catch{}const $=x=>document.getElementById(x),types=[["🌳","木"],["🌸","花"],["🪑","ベンチ"],["🏡","小さな家"],["🪨","石"],["🌲","針葉樹"]];let selected=Math.max(0,Math.min(5,Number(new URLSearchParams(location.search).get("craft"))||0)),detailIndex=null;const completed=missions.filter(m=>m.archived&&m.steps?.length&&m.steps.every(s=>s.done));function save(){try{localStorage.setItem(WKEY,JSON.stringify(world))}catch{alert("保存できませんでした")}}function inventory(){const used=new Set(world.cells.filter(Boolean).map(x=>x.missionId));const bag=completed.filter(m=>!used.has(m.id));$("inventory").replaceChildren();types.forEach(([icon,name],i)=>{const b=document.createElement("button");b.className="item";b.setAttribute("aria-pressed",String(selected===i));b.textContent=icon+" "+name;b.onclick=()=>{selected=i;inventory()};$("inventory").append(b)});$("message").textContent="配置できる達成記録："+bag.length+" 件。クリアしたミッション1件につき、庭のアイテム1つを配置できるよ。";$("status").textContent="獲得済み "+completed.length+" 件 ／ 庭に配置 "+world.cells.filter(Boolean).length+" 件"}function draw(){const root=$("garden");root.replaceChildren();world.cells.forEach((cell,i)=>{const b=document.createElement("button");b.className="tile";b.textContent=cell?types[cell.type]?.[0]||"🌱":"·";b.setAttribute("aria-label",cell?"配置済みアイテムを確認":"空きマスに配置");b.onclick=()=>{if(cell){detailIndex=i;const m=missions.find(x=>x.id===cell.missionId);$("detailTitle").textContent=(types[cell.type]?.[0]||"🌱")+" "+(types[cell.type]?.[1]||"思い出");$("detailText").textContent=m?"達成したミッション："+m.name+"\n\n"+m.steps.map(s=>"✓ "+s.text).join("\n")+(m.completedAt?"\n\n達成日："+new Date(m.completedAt).toLocaleDateString("ja-JP"):""):"このアイテムの元になった記録は見つかりませんでした。";$("detail").showModal();return}const used=new Set(world.cells.filter(Boolean).map(x=>x.missionId));const m=completed.find(x=>!used.has(x.id));if(!m){$("message").textContent="新しい素材は、現実のミッションをクリアすると手に入るよ！";return}world.cells[i]={type:selected,missionId:m.id};RealLineAudio.effect("place");save();draw();inventory()};root.append(b)})} $("remove").onclick=()=>{if(detailIndex!==null){world.cells[detailIndex]=null;save();draw();inventory()}RealLineAudio.effect("place");$("detail").close()};$("close").onclick=()=>$("detail").close();draw();inventory();RealLineAudio.mount("world");</script></body></html>
