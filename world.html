<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142c37"><title>REAL LINE WORLD</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#fff5dd;background:#101f2d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#335f60,#101f2d 75%)}main{max-width:800px;margin:auto;padding:18px 14px 70px}a{color:#f8d591}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px}h1{font-size:clamp(30px,7vw,50px);margin:22px 0 5px;color:#ffe5a2}p{color:#b9d4d2;line-height:1.6}.panel{border:1px solid #71938a;background:#162d3ac9;border-radius:18px;padding:16px;margin:16px 0}.garden{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;aspect-ratio:1.2;background:linear-gradient(145deg,#81ad77,#4e865d);padding:8px;border:6px solid #aa9a6c;border-radius:20px;box-shadow:0 18px 40px #0008;transform:perspective(850px) rotateX(12deg);transform-origin:top}.tile{border:1px solid #a8d1984a;border-radius:7px;background:#ffffff0c;display:grid;place-items:center;font-size:clamp(19px,5vw,36px);cursor:pointer;min-width:0;box-shadow:inset 0 2px #ffffff15}.tile:focus-visible{outline:3px solid #ffe9a8}.tile.selected{outline:3px solid #fff1a2;background:#fff3aa4a}.inventory{display:flex;gap:8px;flex-wrap:wrap}.item,button{font:inherit;border:1px solid #9bb7aa;background:#25485a;color:#fff3d6;border-radius:11px;padding:10px;cursor:pointer}.item[aria-pressed=true]{background:#8c713e;border-color:#ffde92}.item:disabled{opacity:.45}.small{font-size:12px;color:#bed5d0}.memory{line-height:1.7;white-space:pre-wrap}.count{font-weight:800;color:#ffe1a0}dialog{background:#1c3440;border:1px solid #b4bd9b;color:#fff6df;border-radius:16px;width:min(92vw,440px);padding:22px}dialog::backdrop{background:#050d16bc}@media(prefers-reduced-motion:reduce){.garden{transform:none}}</style></head><body><main><div class="top"><a href="./real.html">← 現実の冒険盤面</a><a href="./index.html">タイトルへ</a></div><h1>🌳 REAL LINE WORLD</h1><p>現実の達成が、庭の景色に変わる。思い出の宿る庭を育てよう。</p><section class="panel"><b>🏡 はじまりの庭</b><p class="small">素材を選んで空きマスをタップすると配置。置いたものをタップすると、達成したミッションが見られるよ。</p><div class="garden" id="garden" aria-label="庭の配置盤面"></div></section><section class="panel"><h2>🎒 素材バッグ</h2><div class="inventory" id="inventory"></div><p class="small" id="message" aria-live="polite"></p></section><section class="panel"><h2>🏆 この庭に宿る記録</h2><p class="small" id="status"></p><p class="small">最初の試作は斜め上から眺める2.5Dの庭。3Dのカメラ移動や家の内装は、これから追加するよ。</p></section></main><dialog id="detail"><h2 id="detailTitle"></h2><div class="memory" id="detailText"></div><p><button id="remove">配置を戻す</button> <button id="close">閉じる</button></p></dialog><script>"use strict";const MKEY="real-line-missions-v1",WKEY="real-line-world-v1";let missions=[],world={cells:Array(36).fill(null)};try{const v=JSON.parse(localStorage.getItem(MKEY)||"[]");if(Array.isArray(v))missions=v}catch{}try{const v=JSON.parse(localStorage.getItem(WKEY)||"{}");if(Array.isArray(v.cells)&&v.cells.length===36)world=v}catch{}const $=x=>document.getElementById(x),types=[["🌳","木"],["🌸","花"],["🪑","ベンチ"],["🏡","小さな家"],["🪨","石"],["🌲","針葉樹"]];let selected=0,detailIndex=null;const completed=missions.filter(m=>m.archived&&m.steps?.length&&m.steps.every(s=>s.done));function save(){try{localStorage.setItem(WKEY,JSON.stringify(world))}catch{alert("保存できませんでした")}}function inventory(){const used=new Set(world.cells.filter(Boolean).map(x=>x.missionId));const bag=completed.filter(m=>!used.has(m.id));$("inventory").replaceChildren();types.forEach(([icon,name],i)=>{const b=document.createElement("button");b.className="item";b.setAttribute("aria-pressed",String(selected===i));b.textContent=icon+" "+name;b.onclick=()=>{selected=i;inventory()};$("inventory").append(b)});$("message").textContent="配置できる達成記録："+bag.length+" 件。クリアしたミッション1件につき、庭のアイテム1つを配置できるよ。";$("status").textContent="獲得済み "+completed.length+" 件 ／ 庭に配置 "+world.cells.filter(Boolean).length+" 件"}function draw(){const root=$("garden");root.replaceChildren();world.cells.forEach((cell,i)=>{const b=document.createElement("button");b.className="tile";b.textContent=cell?types[cell.type]?.[0]||"🌱":"·";b.setAttribute("aria-label",cell?"配置済みアイテムを確認":"空きマスに配置");b.onclick=()=>{if(cell){detailIndex=i;const m=missions.find(x=>x.id===cell.missionId);$("detailTitle").textContent=(types[cell.type]?.[0]||"🌱")+" "+(types[cell.type]?.[1]||"思い出");$("detailText").textContent=m?"達成したミッション："+m.name+"\n\n"+m.steps.map(s=>"✓ "+s.text).join("\n")+(m.completedAt?"\n\n達成日："+new Date(m.completedAt).toLocaleDateString("ja-JP"):""):"このアイテムの元になった記録は見つかりませんでした。";$("detail").showModal();return}const used=new Set(world.cells.filter(Boolean).map(x=>x.missionId));const m=completed.find(x=>!used.has(x.id));if(!m){$("message").textContent="新しい素材は、現実のミッションをクリアすると手に入るよ！";return}world.cells[i]={type:selected,missionId:m.id};save();draw();inventory()};root.append(b)})} $("remove").onclick=()=>{if(detailIndex!==null){world.cells[detailIndex]=null;save();draw();inventory()}$("detail").close()};$("close").onclick=()=>$("detail").close();draw();inventory();</script></body></html>
