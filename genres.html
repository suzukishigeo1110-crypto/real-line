<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1323"><title>REAL LINE | ジャンル選択</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#0c1323}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#243450,#0c1323 75%);min-height:100dvh}main{max-width:580px;margin:auto;padding:22px 16px 55px}a{color:#f1ce8a;text-decoration:none}h1{font-size:31px;color:#f5d699;margin:25px 0 8px}p{color:#aebcd0;line-height:1.6}.item{display:flex;gap:17px;align-items:center;padding:19px 16px;margin:13px 0;border-radius:16px;background:linear-gradient(110deg,#283950,#1a2437);border:1px solid #57617a;color:white;box-shadow:0 7px 22px #0005}.item:active{transform:scale(.99)}.item .emoji{font-size:38px}.info{flex:1}.name{font-size:20px;font-weight:800}.desc{color:#aebcd0;font-size:12px;margin-top:5px}.count{color:#efca8c;font-size:12px;margin-top:6px}.arrow{font-size:22px;color:#f0d09b}.bar{height:5px;border-radius:8px;background:#394359;margin-top:9px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#7ccbb6,#f1c77f)}.top{display:flex;justify-content:space-between;align-items:center}.xp{color:#eec785;font-weight:800}</style></head><body><main><div class="top"><a href="./index.html">← タイトルへ</a><a href="./real.html">🧭 現実の盤面へ</a><span id="xp" class="xp"></span></div><h1>🗺️ ジャンルを選ぶ</h1><p>どの世界で冒険する？ ジャンルごとにレベルを選べるよ。</p><div id="items"></div></main><script>"use strict";let s={};try{s=JSON.parse(localStorage.getItem("real-line-v01")||"{}")}catch{};const fields=[["business","📊","経営","数字を読み、未来を決める"],["cafe","☕","カフェ","品質と仕組みを育てる"],["family","❤️","パートナー・家族","大切な人との対話とつながりを育てる"],["mentor","🤝","仲間・育成","信頼を築き、共に成長する"],["adventure","✨","冒険","まだ知らない世界を発見する"]];const wins=Object.values(s.clear||{}).filter(Boolean).length,actions=Object.values(s.real||{}).filter(Boolean).length;document.getElementById("xp").textContent="EXP "+(wins*100+actions*50);const root=document.getElementById("items");fields.forEach(([id,emoji,name,desc])=>{const count=Array.from({length:5},(_,i)=>!!(s.clear||{})[id+"-"+i]||(id==="family"&&!!(s.clear||{})["partner-"+i])).filter(Boolean).length;const a=document.createElement("a");a.className="item";a.href="./stages.html?field="+id;a.innerHTML='<span class="emoji">'+emoji+'</span><div class="info"><div class="name">'+name+'</div><div class="desc">'+desc+'</div><div class="count">CLEAR '+count+' / 5</div><div class="bar"><div style="width:'+(count*20)+'%"></div></div></div><span class="arrow">›</span>';root.append(a)})</script></body></html>
