<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#193e3c"><title>REAL LINE｜現実世界のクエスト</title><style>*{box-sizing:border-box}html{background:#0d2430}body{margin:0;min-height:100dvh;color:#f9efd6;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#102b38d9,#132d35ed),url("./assets/real-line-portrait-home.webp") center/cover fixed}main{max-width:560px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;font-size:12px}.top a,.links a{color:#ffe5a3}.title{font-size:28px;margin:17px 0 4px;text-shadow:0 3px 8px #000}.sub{font-size:13px;color:#e3e8d8;line-height:1.65}.notice{background:#143947eb;border:1px solid #d5b877;border-radius:14px;padding:12px;margin:14px 0;font-size:12px;line-height:1.7}.cards{display:grid;gap:11px}.quest{border:2px solid #c2a36b;border-radius:16px;padding:15px;background:linear-gradient(135deg,#244a49f5,#182f41f5);box-shadow:0 8px 22px #07151c8a}.quest h2{font-size:19px;margin:3px 0 8px;color:#ffe5a4}.quest p{font-size:12px;line-height:1.7;color:#d7e3de;margin:7px 0}.tag{font-size:11px;color:#ffde8b;letter-spacing:.05em}.steps{display:grid;gap:9px;margin:12px 0}.step{display:flex;gap:9px;align-items:flex-start;border:1px solid #a1b2a273;border-radius:9px;padding:9px;background:#0e2738b5;font-size:13px;line-height:1.55}.step input{accent-color:#d4aa51;width:19px;height:19px;flex-shrink:0;margin-top:1px}.step:has(input:checked){background:#305447b5;border-color:#b6c88c}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{border:1px solid #bfa779;border-radius:9px;padding:9px 10px;background:#1e4551;text-decoration:none;font-size:12px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#ffdb8e;margin-top:10px}.reward{font-weight:800}.complete{border:1px solid #bda369;border-radius:9px;padding:8px 10px;background:#5c4c2d;color:#fff0c9;font-weight:800}.complete:disabled{opacity:.55}.progress{height:8px;background:#0a1e27;border-radius:9px;overflow:hidden;margin-top:9px}.progress div{height:100%;width:0;background:linear-gradient(90deg,#71b988,#f8d478);transition:width .2s}.status{font-size:11px;color:#c5d5cf;margin-top:5px}.disclaimer{font-size:11px;line-height:1.65;color:#c9d9d4;padding:13px 3px}button{font:inherit;cursor:pointer}</style></head><body><main><div class="top"><a href="./portrait.html">← ホームに戻る</a><span>REAL LINE / WORLD QUESTS</span></div><h1 class="title">📜 現実世界のクエスト</h1><div class="sub">世界が変わるたび、冒険が増える。<br>「知る → 確かめる → 行動する」で成長しよう。</div><div class="notice"><b>🧭 まずは体験版！</b><br>下のクエストは、最新の法律や補助金の公募を確認したものではありません。実際の制度・対象者・期限は必ずリンク先の公式情報で確認してね。今後、更新日・出典付きの新着クエストを届ける仕組みに育てていくよ。</div><div id="cards" class="cards"></div><p class="disclaimer">⚠️ 法律・税金・補助金の判断は、施行日・地域・業種・事業規模などで異なります。この画面は学習用であり、申請の可否や受給を保証するものではありません。申請前に各機関の最新案内を確認してください。</p></main><script>"use strict";const KEY="real-line-world-quests-v1";const quests=[{id:"subsidy-check",tag:"🏪 経営・補助金",title:"自分の事業で使える支援制度を探せ！",description:"今使える制度があるか、公式の公募情報を確認しよう。見つからなくても調べた経験が力になる。",steps:["公式サイトで募集中の制度を探した","対象地域・業種・従業員数などの条件を確認した","公募期間・申請期限・必要書類を確認した","自分の事業で申請するか判断し、次の一手をメモした"],links:[["中小企業庁","https://www.chusho.meti.go.jp/"],["Jグランツ（補助金）","https://www.jgrants-portal.go.jp/"]]}, {id:"law-check",tag:"⚖️ 法律・制度",title:"自分の仕事に関係する制度改正を調べよ！",description:"労務・食品衛生・税務など、事業に影響する改正がないか一次情報で確認しよう。",steps:["確認する分野（労務・衛生・税など）を選んだ","官公庁の公式情報で改正内容を調べた","施行日・対象事業者・経過措置を確認した","対応が必要か判断し、関係者への共有事項をまとめた"],links:[["e-Gov法令検索","https://laws.e-gov.go.jp/"],["厚生労働省","https://www.mhlw.go.jp/"],["国税庁","https://www.nta.go.jp/"]]}, {id:"business-trends",tag:"📊 経営・情報収集",title:"経営の変化を、自分の判断につなげよ！",description:"ニュースを眺めるだけで終わらず、統計や公的資料から自分の事業への影響を考えよう。",steps:["調べたいテーマ（物価・賃金・消費など）を選んだ","公的な統計や資料で数字・対象期間を確認した","自分の事業に関係する変化を一つ書き出した","実行すること・様子を見ることを判断した"],links:[["e-Stat 政府統計","https://www.e-stat.go.jp/"],["日本銀行","https://www.boj.or.jp/"]]}];let data={};try{data=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch{}const root=document.getElementById("cards");function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}function render(){root.replaceChildren();quests.forEach(q=>{const state=data[q.id]||{checks:[],done:false},checks=Array.isArray(state.checks)?state.checks:[],card=document.createElement("article");card.className="quest";const tag=document.createElement("div");tag.className="tag";tag.textContent=q.tag+" · 出典確認型クエスト";const h=document.createElement("h2");h.textContent=q.title;const desc=document.createElement("p");desc.textContent=q.description;const steps=document.createElement("div");steps.className="steps";q.steps.forEach((s,i)=>{const l=document.createElement("label");l.className="step";const input=document.createElement("input");input.type="checkbox";input.checked=!!checks[i];input.onchange=()=>{const current=data[q.id]||{checks:[],done:false};current.checks=Array.isArray(current.checks)?current.checks:[];current.checks[i]=input.checked;if(!input.checked)current.done=false;data[q.id]=current;save();render()};const t=document.createElement("span");t.textContent=s;l.append(input,t);steps.append(l)});const links=document.createElement("div");links.className="links";q.links.forEach(([name,url])=>{const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent="↗ "+name;links.append(a)});const doneCount=q.steps.filter((_,i)=>checks[i]).length;const bar=document.createElement("div");bar.className="progress";const fill=document.createElement("div");fill.style.width=100*doneCount/q.steps.length+"%";bar.append(fill);const status=document.createElement("div");status.className="status";status.textContent=doneCount+"/"+q.steps.length+" ステップ確認済み"+(state.done?" · 🏆 達成記録済み":"");const foot=document.createElement("div");foot.className="foot";const reward=document.createElement("span");reward.className="reward";reward.textContent=state.done?"🏆 クエスト達成！":"🎁 達成報酬：知識の証 ×1";const btn=document.createElement("button");btn.className="complete";btn.textContent=state.done?"達成済み":"達成を記録";btn.disabled=doneCount!==q.steps.length||!!state.done;btn.onclick=()=>{data[q.id]={checks:q.steps.map(()=>true),done:true,completedAt:new Date().toISOString()};save();render()};foot.append(reward,btn);card.append(tag,h,desc,steps,links,bar,status,foot);root.append(card)})}render();</script></body></html>
