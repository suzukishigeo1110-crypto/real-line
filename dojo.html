<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a2b"><title>REAL LINE | クイズ道場</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#17253b,#0c1323);color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh}main{max-width:620px;margin:auto;padding:18px 16px 50px}a{color:#f4d28f;text-decoration:none}.hero{padding:20px;border:1px solid #725f43;border-radius:18px;background:#182a3ddd}h1{margin:5px 0;color:#f5d699}.sub{color:#b9c6d7;line-height:1.55}.meter{height:9px;background:#344158;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:#e8c57d}.stats{display:flex;justify-content:space-between;margin:9px 0;color:#f1d49b;font-weight:800}.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:16px 0}.modes button{padding:9px 2px;border-radius:10px;border:1px solid #657188;background:#24344b;color:#fff;font-size:11px}.modes button.on{border-color:#f2cc7c;background:#59492f}.card{margin-top:15px;padding:18px;border-radius:18px;background:#1b2b40;border:1px solid #526078}.tag{color:#eecb83;font-size:12px;font-weight:800}.q{font-size:19px;font-weight:800;line-height:1.55;margin:10px 0 16px}.answers{display:grid;gap:9px}.answers button{padding:13px;text-align:left;border:1px solid #637089;border-radius:12px;background:#26384f;color:#fff;font-size:15px}.feedback{margin-top:13px;padding:12px;border-radius:12px;background:#101d2d;line-height:1.5;display:none}.next{width:100%;margin-top:12px;padding:13px;border:1px solid #e5c378;border-radius:12px;background:#6b5330;color:#fff;font-weight:800;display:none}.terms{margin-top:20px}.term{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #ffffff18;color:#cbd5e2}.term b{color:#f1cf8c}</style></head><body><main><a href="./genres.html">← バトルへ</a><section class="hero"><h1>🧠 クイズ道場</h1><div class="sub">目標は「知ってる」ではなく、用語を実務で使えること。まず経営100用語を育てよう。</div><div class="stats"><span id="master">MASTER 0 / 100</span><span id="streak">0問正解</span></div><div class="meter"><i id="bar" style="width:0%"></i></div></section><div class="modes" id="modes"></div><section class="card"><div class="tag" id="tag"></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">次の問題 →</button></section><section class="terms"><h2>📚 習熟中の用語</h2><div id="terms"></div></section></main><script src="./data/dojo-business-extra.js"></script><script>"use strict";const KEY="real-line-dojo-v1";let s;try{s=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{s={}}s.mastery=s.mastery||{};s.skills=s.skills||{};let level=Number(s.level||0),correct=0;const meta=[["🌱","入門"],["⚔️","初級"],["🔥","中級"],["💀","上級"],["👑","極"]];const bank=[["売上高","商品やサービスを販売して得た金額の合計"],["原価率","売上高に対する売上原価の割合"],["粗利益","売上高から売上原価を引いた利益"],["粗利率","売上高に対する粗利益の割合"],["固定費","売上の増減にかかわらず発生しやすい費用"],["変動費","売上や販売量に応じて増減する費用"],["限界利益","売上高から変動費を引いた利益"],["限界利益率","売上高に対する限界利益の割合"],["損益分岐点","利益がちょうどゼロになる売上水準"],["FL比率","FoodとLaborの合計が売上に占める割合"],["客単価","売上高を客数で割った平均利用額"],["回転率","一定期間に席や在庫などが入れ替わる度合い"],["人時売上高","売上高を総労働時間で割った生産性指標"],["営業利益","本業の営業活動から得た利益"],["キャッシュフロー","一定期間のお金の流入と流出"],["運転資金","日常の事業運営に必要となる資金"],["売掛金","販売済みだがまだ回収していない代金"],["買掛金","仕入済みだがまだ支払っていない代金"],["棚卸資産","販売や使用のため保有する商品・原材料など"],["棚卸差異","帳簿上の在庫と実際の在庫との差"],["損益計算書","一定期間の収益・費用・利益を示す財務諸表"],["貸借対照表","ある時点の資産・負債・純資産を示す財務諸表"],["純利益","税金なども反映した最終的な利益"],["経常利益","本業と通常の営業外損益を含む利益"],["減価償却","固定資産の取得費を使用期間に配分する会計処理"],["流動資産","通常1年以内に現金化・費消される資産"],["流動負債","通常1年以内に支払期限が来る負債"],["自己資本比率","総資本に占める自己資本の割合"],["ROA","総資産に対する利益の効率性を見る指標"],["ROE","自己資本に対する利益の効率性を見る指標"],["ROI","投資額に対する利益・効果を見る指標"],["KPI","目標達成までの重要な進捗指標"],["KGI","最終的な目標達成度を測る指標"],["LTV","顧客が取引期間にもたらす価値"],["CAC","新規顧客1人を獲得するためのコスト"],["CVR","訪問などに対して成果に至った割合"],["リピート率","顧客が再度利用した割合"],["在庫回転率","在庫が一定期間に何回入れ替わったかを見る指標"],["歩留まり","投入量に対して使用可能分が得られた割合"],["機会損失","別の選択をしていれば得られた可能性のある利益"]];if(window.REAL_LINE_DOJO_EXTRA)bank.push(...window.REAL_LINE_DOJO_EXTRA);function save(){s.level=level;localStorage.setItem(KEY,JSON.stringify(s))}function modes(){const e=document.getElementById("modes");e.innerHTML="";meta.forEach((x,i)=>{const b=document.createElement("button");b.textContent=x[0]+x[1];b.className=i===level?"on":"";b.onclick=()=>{level=i;save();modes();ask()};e.append(b)})}function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}function ask(){const idx=Math.floor(Math.random()*bank.length),term=bank[idx][0],def=bank[idx][1];let q,opts,answer;if(level===0){q="「"+term+"」に最も近い説明は？";opts=shuffle([def,...shuffle(bank.filter((_,i)=>i!==idx)).slice(0,3).map(x=>x[1])]);answer=def}else if(level===1){q=def+"。この用語は？";opts=shuffle([term,...shuffle(bank.filter((_,i)=>i!==idx)).slice(0,3).map(x=>x[0])]);answer=term}else{const pools=[{"原価率":"売上100万円、売上原価30万円。まず確認できる比率は？","FL比率":"食材費率32%、人件費率28%。食材と人件費を合わせて管理する指標は？","人時売上高":"売上120万円、総労働時間400時間。スタッフの生産性を見る指標は？","損益分岐点":"固定費と限界利益率から、赤字と黒字の境目となる売上を知りたい。何を見る？","運転資金":"売掛金と在庫が増え、買掛金は変わらない。日常の資金繰りで意識するものは？"},{"粗利益":"売上は伸びたが、食材原価の上昇で売上から原価を引いた利益が減った。直接悪化したものは？","キャッシュフロー":"黒字なのに入金が遅く、今月の支払い現金が足りない。利益とは別に最優先で確認するものは？","KPI":"年間利益という最終目標に向け、客単価や再来店率を毎週追いたい。この途中指標は？","棚卸差異":"帳簿では食材10万円分あるが、実際に数えると8万円分しかない。この2万円のズレは？","機会損失":"満席で予約を断り続けた。実際の支出ではないが、本来得られた可能性のある利益を何という？"},{"限界利益率":"新規イベントを受けるか判断したい。追加売上から追加で増える費用を除いた稼ぐ力を、売上比率で比較するなら？","手元流動性":"利益は出ているが大型支払いが迫る。倒れないため、すぐ使える現預金などの余力を確認したい。何を見る？","ROI":"100万円投資した新設備が、投資額に対してどれだけ利益・効果を生んだか評価したい。何を見る？","LTV":"広告費をどこまでかけられるか考えるため、顧客一人が取引期間全体でもたらす価値を見たい。何を見る？","メニューエンジニアリング":"人気度と利益性の両方からメニューを分類し、残す・育てる・見直すを判断したい。何を使う？"}];const cases=pools[level-2],keys=Object.keys(cases),t=keys[Math.floor(Math.random()*keys.length)];q=cases[t];answer=t;opts=shuffle([t,...shuffle(bank.map(x=>x[0]).filter(x=>x!==t)).slice(0,3)]);const idx2=bank.findIndex(x=>x[0]===t);window.currentIdx=idx2;window.currentTerm=t;render(q,opts,answer);return}window.currentIdx=idx;window.currentTerm=term;render(q,opts,answer)}function render(q,opts,answer){document.getElementById("tag").textContent=meta[level][0]+" "+meta[level][1]+" ｜ "+window.currentTerm;document.getElementById("question").textContent=q;const a=document.getElementById("answers");a.innerHTML="";document.getElementById("feedback").style.display="none";document.getElementById("next").style.display="none";opts.forEach(o=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>judge(o===answer,answer);a.append(b)});stats()}function judge(ok,answer){document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);const f=document.getElementById("feedback");f.style.display="block";if(ok){correct++;const t=window.currentTerm;const k=["meaning","recall","apply","distinguish","judge"][level];s.skills[t]=s.skills[t]||{};s.skills[t][k]=true;s.mastery[t]=Object.values(s.skills[t]).filter(Boolean).length;f.textContent="✨ 正解！ "+bank[window.currentIdx][0]+"： "+bank[window.currentIdx][1]}else{f.textContent="まだ伸びる！ 正解は「"+answer+"」。 "+bank[window.currentIdx][1]}save();stats();document.getElementById("next").style.display="block"}function stats(){const vals=Object.values(s.mastery),master=vals.filter(v=>v>=5).length;document.getElementById("master").textContent="MASTER "+master+" / 100";document.getElementById("streak").textContent=correct+"問正解";document.getElementById("bar").style.width=master+"%";const e=document.getElementById("terms");e.innerHTML="";Object.entries(s.mastery).sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(([t,v])=>{const d=document.createElement("div");d.className="term";d.innerHTML="<span>"+t+"</span><b>"+"★".repeat(v)+"☆".repeat(5-v)+"</b>";e.append(d)});if(!e.children.length)e.textContent="正解すると用語の習熟度が育つよ。"}document.getElementById("next").onclick=ask;modes();ask();</script></body></html>
